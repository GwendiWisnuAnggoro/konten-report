name: Unpack CDN & Build Assets

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend packages
        run: |
          npm install --no-save tailwindcss @tailwindcss/cli lucide @fontsource/inter

      - name: Build Tailwind locally
        run: |
          mkdir -p vendor
          npx @tailwindcss/cli -i ./vendor/tailwind.input.css -o ./vendor/tailwind.css --minify

      - name: Unpack Lucide locally
        run: |
          mkdir -p vendor
          cp node_modules/lucide/dist/umd/lucide.js vendor/lucide.js

      - name: Unpack Inter font locally
        run: |
          rm -rf vendor/inter
          cp -R node_modules/@fontsource/inter vendor/inter

      - name: Remove package metadata from vendor
        run: |
          rm -f vendor/inter/package.json
          rm -f vendor/inter/README.md
          rm -f vendor/inter/LICENSE

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor
          if git diff --cached --quiet; then
            echo "Tidak ada asset baru."
          else
            git commit -m "build: unpack CDN assets [skip ci]"
            git push
          fi
